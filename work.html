<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rajatha Rao V — Design Archive</title>
<meta name="description" content="Portfolio of Rajatha Rao V, Product Designer and UX Designer.">
<style>
:root{--ink:#111;--ink2:#666;--paper:#fafaf8;--line:#e5e5e5;--accent:#ee5b35;--ease:cubic-bezier(.2,.8,.2,1);
--w:min(calc((100vh - 290px)*.78),38vw);--h:calc(var(--w)*.7);--sk:18deg;--sx:.8;--rw:calc(var(--w)*var(--sx));--ch:calc(var(--w)*(.7 + var(--sx)*.325))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html{background:#F7F9FC}body{overflow:hidden;background-color:#F7F9FC;background-image:radial-gradient(#cdd0d7 .8px,transparent .8px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
main{height:calc(100dvh - var(--sx-h,67px) - 38px);min-height:600px;display:grid;grid-template-rows:1fr auto;padding:0 3vw env(safe-area-inset-bottom);position:relative;overflow:hidden}

header{display:flex;justify-content:space-between;align-items:baseline;padding:calc(22px + env(safe-area-inset-top)) 0 0;font-size:13px;z-index:30}
.brand{font-weight:700;letter-spacing:-.03em;font-size:17px}
.brand span{font-weight:400;color:var(--ink2)}
nav{display:flex;gap:26px}
nav button,.idx button{background:none;border:0;padding:2px 0;position:relative}
nav button:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav button:hover:after,nav button[aria-current=true]:after{transform:scaleX(1)}

/* stage + cards */
.stage{position:relative;perspective:1700px;perspective-origin:50% 40%;margin:40px 0 0}
.rig{position:absolute;top:0;bottom:0;left:50%;width:calc(var(--rw)*3);margin-left:calc(var(--rw)*-1.5);transform-style:preserve-3d;transform:rotateY(calc(var(--mx,0)*2deg)) rotateX(calc(var(--my,0)*-1.5deg));transition:transform .5s var(--ease)}
.card{--ky:calc(1 - var(--i)/4);--d:calc(5 - var(--i));position:absolute;width:var(--w);height:var(--h);left:calc(var(--rw)*.5*var(--i));top:calc((100% - var(--ch))*var(--ky));transform-origin:0 0;border:0;padding:0;background:none;text-align:left;transform-style:preserve-3d;transform:translate3d(calc(var(--mx,0)*var(--d)*-7px + var(--ox,0px)),calc(var(--my,0)*var(--d)*-4px + var(--oy,0px)),calc(var(--d)*10px)) skewY(var(--sk)) scaleX(var(--sx));transition:transform .7s var(--ease),opacity .5s,filter .5s}
.tag{position:absolute;left:calc(var(--rw)*.5*var(--i));top:calc((100% - var(--ch))*(1 - var(--i)/4) - 28px);font-size:14px;font-weight:500;transition:opacity .4s}
.slab{position:absolute;inset:0;background:#c9c8c2;transform:translate(-3px,7px);box-shadow:-14px 22px 30px rgba(0,0,0,.16),-3px 5px 6px rgba(0,0,0,.14);transition:box-shadow .6s var(--ease)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:2px;color:#fff;container-type:size;perspective:700px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.face:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 35%,rgba(0,0,0,.2));pointer-events:none;z-index:3}
.light .face{color:#111}
.light .face:after{background:linear-gradient(115deg,rgba(255,255,255,.5),transparent 35%,rgba(0,0,0,.08))}
.lbl{position:absolute;left:7%;right:50%;bottom:8%;z-index:4}
.lbl b{display:block;font-size:clamp(16px,1.6vw,26px);letter-spacing:-.045em;line-height:1}
.lbl i{display:block;font-style:normal;font-size:11px;margin-top:6px;opacity:.75}
.lbl em{font-style:normal;font-size:11px;position:absolute;right:0;top:0;opacity:0;transform:translateY(4px);transition:.4s var(--ease)}
.card:hover,.card:focus-visible,.card.hl{z-index:5;transform:translate3d(0,-10px,80px) skewY(var(--sk)) scaleX(var(--sx)) scale(1.04);outline:none}
.card:focus-visible .face{outline:2px solid var(--accent);outline-offset:4px}
.card:hover .slab,.card.hl .slab{box-shadow:-28px 42px 58px rgba(0,0,0,.24),-6px 8px 12px rgba(0,0,0,.18)}
.card:hover .lbl em,.card.hl .lbl em{opacity:1;transform:none}
.stage.has-hl .card:not(.hl){opacity:.5;filter:saturate(.6)}
.stage.focus .card{pointer-events:none;opacity:0}
.stage.focus .card.on{opacity:1;z-index:8;transform:translate3d(var(--fx),var(--fy),120px) scale(1.1)}
.stage.focus .tag{opacity:0}
.stage.focus .card:not(.on) *{animation-play-state:paused}

/* ===== animated 3D scenes (sizes in cqw so they scale with the card) ===== */
.scene{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(var(--px,0)*10deg)) rotateX(calc(var(--py,0)*-10deg));transition:transform .4s var(--ease)}
.scene *{position:absolute;transform-style:preserve-3d}
.fit{left:30cqw;top:-1cqw;width:100cqw;height:140cqw;transform-origin:0 0;transform:scale(.66)}
.bg-fs{background:linear-gradient(150deg,#2a2f33,#090a0b)}
.bg-en{background:linear-gradient(150deg,#4C6FFF,#2F56B1)}
.bg-sc{background:#dedcd7}
.bg-crm{background:linear-gradient(150deg,#26363a,#0e171a)}
.bg-cs{background:#efe8dc}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3cqw}}
@keyframes sway{from{transform:rotateY(-26deg) rotateX(8deg) rotateZ(-5deg)}to{transform:rotateY(-6deg) rotateX(4deg) rotateZ(-2deg)}}
@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes draw{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes ringspin{to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes pop{0%{opacity:0;translate:0 8cqw -14cqw}14%,72%{opacity:1;translate:0 0 0}90%,100%{opacity:0;translate:0 -4cqw 6cqw}}
@keyframes ring{from{transform:scale(.4);opacity:.7}to{transform:scale(1.5);opacity:0}}
@keyframes ringle{0%,100%{rotate:-14deg}50%{rotate:14deg}}
@keyframes breathe{0%,100%{transform:scale(.88)}50%{transform:scale(1.1)}}
@keyframes shade{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.1);opacity:.25}}
@keyframes slide{0%,100%{translate:0 0}50%{translate:4cqw 0}}

/* Firstock: swaying phone with live chart */
.fs-p{left:26cqw;top:16cqw;width:50cqw;height:96cqw;border-radius:6cqw;background:#0e1114;border:.6cqw solid #3a4249;animation:sway 7s ease-in-out infinite alternate;box-shadow:0 6cqw 8cqw rgba(0,0,0,.5)}
.fs-g{left:26cqw;top:16cqw;width:50cqw;height:96cqw;border-radius:6cqw;background:#1a2026;transform:translateZ(-10cqw) rotateY(-20deg);opacity:.7}
.fs-h{left:5cqw;top:6cqw;width:20cqw;height:2cqw;border-radius:1cqw;background:#59636b}
.fs-v{left:5cqw;top:11cqw;width:34cqw;height:5cqw;border-radius:1cqw;background:#e9ecee}
.fs-bars{left:5cqw;top:52cqw;width:38cqw;height:24cqw;display:flex;gap:1.6cqw;align-items:flex-end}
.fs-bars i{position:relative;flex:1;background:#4fd18b;border-radius:.6cqw;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite;height:100%;opacity:.85}
.fs-bars i:nth-child(1){height:40%}.fs-bars i:nth-child(2){height:62%;animation-delay:.2s}.fs-bars i:nth-child(3){height:48%;animation-delay:.4s}.fs-bars i:nth-child(4){height:80%;animation-delay:.6s}.fs-bars i:nth-child(5){height:66%;animation-delay:.8s}.fs-bars i:nth-child(6){height:96%;animation-delay:1s}
.fs-l{left:3cqw;top:20cqw;width:44cqw;height:28cqw;overflow:visible}
.fs-l path{stroke-dasharray:200;animation:draw 4s ease-in-out infinite}
.fs-b{left:5cqw;top:82cqw;width:40cqw;height:8cqw;border-radius:1.4cqw;background:#4fd18b}
.fs-c{left:60cqw;top:24cqw;width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7af0b2,#2b9c63);transform:translateZ(22cqw);animation:bob 4s ease-in-out infinite;box-shadow:0 3cqw 4cqw rgba(0,0,0,.45)}

/* E-Notifiers: notifications arriving in depth */
.en-n{left:12cqw;width:70cqw;height:19cqw;border-radius:2.4cqw;background:rgba(255,255,255,.1);border:.3cqw solid rgba(255,255,255,.2);backdrop-filter:blur(2px);animation:pop 6s ease-in-out infinite;opacity:0}
.en-n:before{content:"";position:absolute;left:3cqw;top:5cqw;width:9cqw;height:9cqw;border-radius:2cqw;background:var(--accent)}
.en-n:after{content:"";position:absolute;left:16cqw;top:5.6cqw;width:42cqw;height:2.4cqw;border-radius:1cqw;background:#e8ebf5;box-shadow:0 5cqw 0 -.4cqw rgba(232,235,245,.4)}
.en-1{top:20cqw;transform:translateZ(30cqw)}.en-2{top:44cqw;animation-delay:1.5s;transform:translateZ(12cqw)}.en-3{top:68cqw;animation-delay:3s;transform:translateZ(-4cqw)}
.en-bell{left:56cqw;top:4cqw;width:24cqw;height:24cqw;transform-origin:50% 8%;animation:ringle 2.4s ease-in-out infinite;z-index:2;transform:translateZ(40cqw)}
.en-r{left:46cqw;top:-6cqw;width:36cqw;height:36cqw;border-radius:50%;border:.5cqw solid var(--accent);animation:ring 2.4s ease-out infinite;transform:translateZ(36cqw)}

/* Second Cycle: rotating device inside a lifecycle ring */
.sc-o{left:0;top:0;width:100%;height:100%;animation:spin 16s linear infinite}
.sc-ph{left:36cqw;top:20cqw;width:28cqw;height:56cqw;border-radius:4cqw;background:#f4f3ef;border:.5cqw solid #a9a8a2;box-shadow:0 0 0 .5cqw #cfcdc6}
.sc-ph:before{content:"";position:absolute;left:3cqw;top:3cqw;right:3cqw;bottom:14cqw;border-radius:2cqw;background:#cfcdc6}
.sc-bk{left:36cqw;top:20cqw;width:28cqw;height:56cqw;border-radius:4cqw;background:#bdbbb4;transform:translateZ(-2cqw)}
.sc-ring{left:14cqw;top:24cqw;width:72cqw;height:72cqw;border-radius:50%;border:2cqw solid #7a9b6b;border-top-color:transparent;transform:rotateX(72deg);animation:ringspin 9s linear infinite}
.sc-leaf{left:44cqw;top:50cqw;width:12cqw;height:12cqw;border-radius:0 100% 0 100%;background:#7a9b6b;transform:translateZ(3cqw) rotate(-20deg);animation:bob 4s ease-in-out infinite}
.sc-sh{left:26cqw;top:84cqw;width:48cqw;height:8cqw;border-radius:50%;background:#000;opacity:.2;filter:blur(2cqw);transform:rotateX(90deg)}

/* Admin CRM: isometric dashboard layers */
.crm-b{left:18cqw;top:20cqw;width:64cqw;height:64cqw;transform:rotateX(58deg) rotateZ(-38deg);transform-style:preserve-3d}
.crm-t{inset:0;background:#e9eef0;border-radius:1.5cqw;box-shadow:3cqw 3cqw 0 #6f8a90}
.crm-r{left:5cqw;right:5cqw;height:5cqw;border-radius:1cqw;background:#b9c7cb;transform:translateZ(1px);animation:slide 4s ease-in-out infinite}
.crm-r:nth-child(2){top:6cqw}.crm-r:nth-child(3){top:14cqw;animation-delay:.3s;width:70%}.crm-r:nth-child(4){top:22cqw;animation-delay:.6s}.crm-r:nth-child(5){top:30cqw;animation-delay:.9s;width:60%}
.crm-c{left:6cqw;top:40cqw;width:24cqw;height:18cqw;background:#33565d;border-radius:1cqw;transform:translateZ(8cqw);animation:bob 5s ease-in-out infinite;box-shadow:2cqw 2cqw 3cqw rgba(0,0,0,.3)}
.crm-d{left:34cqw;top:34cqw;width:24cqw;height:24cqw;background:var(--accent);border-radius:1cqw;transform:translateZ(16cqw);animation:bob 5s ease-in-out infinite .8s;box-shadow:2cqw 2cqw 3cqw rgba(0,0,0,.3)}
.crm-d i{position:absolute;bottom:3cqw;width:3.2cqw;background:#fff;opacity:.9;transform-origin:bottom;animation:grow 3s ease-in-out infinite}
.crm-d i:nth-child(1){left:3cqw;height:8cqw}.crm-d i:nth-child(2){left:8.5cqw;height:14cqw;animation-delay:.3s}.crm-d i:nth-child(3){left:14cqw;height:10cqw;animation-delay:.6s}.crm-d i:nth-child(4){left:19.5cqw;height:17cqw;animation-delay:.9s}

/* CalmSpace: breathing sphere */
.cs-ar{left:20cqw;top:34cqw;width:60cqw;height:52cqw;border-radius:30cqw 30cqw 0 0;background:#e3d6c1}
.cs-ar2{left:32cqw;top:44cqw;width:36cqw;height:42cqw;border-radius:18cqw 18cqw 0 0;background:#f6efe3;transform:translateZ(2cqw)}
.cs-s{left:50cqw;top:14cqw;width:32cqw;height:32cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,#d9c9ae 70%);animation:breathe 5s ease-in-out infinite;transform:translateZ(16cqw);box-shadow:0 4cqw 6cqw rgba(138,118,88,.35)}
.cs-h{left:42cqw;top:6cqw;width:48cqw;height:48cqw;border-radius:50%;border:.4cqw solid #b9a37f;animation:ring 5s ease-out infinite;transform:translateZ(12cqw)}
.cs-h.b{animation-delay:2.5s}
.cs-sh{left:50cqw;top:84cqw;width:30cqw;height:5cqw;border-radius:50%;background:#8a7658;filter:blur(2cqw);animation:shade 5s ease-in-out infinite}
.cs-p{left:12cqw;top:70cqw;width:14cqw;height:14cqw;border-radius:50%;background:#c9b595;transform:translateZ(8cqw);animation:bob 6s ease-in-out infinite}

/* bottom */
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:12px 0 3vh;z-index:20}
h1{margin:0;font-size:clamp(48px,8.6vw,150px);font-weight:800;letter-spacing:-.075em;line-height:.8}
h1 sup{font-size:.5em;color:var(--accent);vertical-align:top;position:relative;top:-.05em;letter-spacing:0}
.stmt{margin:14px 0 0;max-width:330px;font-size:13px;line-height:1.5;color:var(--ink2)}
.idx{display:flex;flex-direction:column;min-width:260px;font-size:14px}
.idx button{display:flex;justify-content:space-between;width:100%;text-align:left;border-top:1px solid var(--line);padding:5px 0;transition:padding .35s var(--ease),color .3s}
.idx button:last-child{border-bottom:1px solid var(--line)}
.idx button.res{margin-top:8px;border-top:1px solid var(--ink)}
.idx button:hover,.idx button.hl{padding-left:10px;color:var(--accent)}

/* panels */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,38vw);background:var(--paper);z-index:40;padding:calc(90px + env(safe-area-inset-top)) 3vw 40px 40px;border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .7s var(--ease),visibility 0s .7s;display:flex;flex-direction:column}
.panel.open{transform:none;visibility:visible;transition:transform .7s var(--ease)}
.panel small{color:var(--ink2);font-size:13px}
.panel h2{font-size:clamp(36px,4.4vw,68px);letter-spacing:-.065em;line-height:.92;margin:14px 0 20px}
.panel p{line-height:1.6;font-size:15px;max-width:380px;margin:0 0 14px}
.panel .note{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.btn{align-self:flex-start;background:none;border:0;border-bottom:1px solid;padding:0 0 4px;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(250,250,248,.86);backdrop-filter:blur(14px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0}}
.dialog{position:relative;background:var(--paper);width:min(720px,100%);max-height:90dvh;overflow:auto;padding:clamp(26px,5vw,56px);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.14)}
.dialog h2{font-size:clamp(38px,6vw,76px);letter-spacing:-.07em;line-height:.92;margin:0 0 20px}
.dialog p{line-height:1.6;max-width:520px;margin:0 0 12px}
.dialog small{color:var(--ink2)}
.close{position:absolute;right:16px;top:12px;background:none;border:0;font-size:28px;line-height:1;padding:6px 10px}
.list button,.list div{display:flex;width:100%;justify-content:space-between;gap:16px;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;font-size:19px;letter-spacing:-.03em;text-align:left}
.list small{align-self:center;text-align:right;letter-spacing:0;font-size:12px}
.list button:hover{color:var(--accent)}
.ph{border-bottom:1px dashed var(--ink2)}

.wipe{position:fixed;inset:0;z-index:100;background:#4C6FFF;color:#fff;display:grid;place-items:center;font-size:clamp(44px,9vw,130px);font-weight:800;letter-spacing:-.07em;pointer-events:none}.wipe.back{background:#4C6FFF}.wipe span{opacity:0}.wipe i{font-style:normal;color:var(--accent)}
@media (max-width:900px){
 body{overflow:auto}
 main{height:auto;min-height:100dvh;overflow:visible;display:block;padding:0 20px env(safe-area-inset-bottom)}
 header{flex-wrap:wrap;gap:14px 0}
 nav{order:3;width:100%;gap:0;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;overflow-x:auto}
 nav button{padding:14px 6px;min-height:44px;font-size:13px;white-space:nowrap}
 .stage{perspective:none;margin:28px 0 0}
 .rig{position:static;width:auto;margin:0;transform:none;display:grid;grid-template-columns:1fr;gap:22px}
 .tag{display:none}
 .card{position:relative;left:auto;top:auto;width:100%;height:auto;aspect-ratio:10/7;transform:none!important;--d:0}
 .slab{transform:none;inset:6px -6px -6px 6px;z-index:-1}
 .card:hover,.card.hl{transform:translateY(-4px)!important}
 .stage.focus .card{opacity:1;pointer-events:auto}
 .bottom{flex-direction:column;align-items:stretch;padding:48px 0 40px}
 h1{font-size:clamp(52px,15vw,120px)}
 .idx{min-width:0}.idx button{padding:14px 0;min-height:48px}
 .panel{width:100%;top:auto;height:82dvh;border-left:0;border-top:1px solid var(--line);padding:32px 24px calc(32px + env(safe-area-inset-bottom));transform:translateY(100%);overflow:auto}
 .panel.open{transform:none}
}
@media (max-width:520px){.lbl{right:36%}}
@media (max-height:720px) and (min-width:901px){.stmt{display:none}}

/* ===== frosted-glass folder cards (original design) ===== */
.sheet{position:absolute;left:44%;right:3%;top:-22px;bottom:12%;border-radius:12px 12px 0 0;background:repeating-linear-gradient(180deg,transparent 0 11px,rgba(60,70,80,.1) 11px 12px) 14px 18px/calc(100% - 28px) 100% no-repeat,linear-gradient(#fff,#f1f2ee);border-top:4px solid var(--fc);box-shadow:0 -6px 18px -8px rgba(20,24,30,.25);transform:rotate(1.4deg);transform-origin:0 100%;transition:transform .6s var(--ease)}
.card:hover .sheet,.card.hl .sheet{transform:translateY(-14px) rotate(2.4deg)}
.slab{inset:auto;left:16%;top:-14px;width:32%;height:20px;border-radius:14px 14px 0 0;background:var(--fc);transform:none;box-shadow:none;z-index:0}
.card:hover .slab,.card.hl .slab{box-shadow:none}
.face{border-radius:6px 18px 18px 18px;box-shadow:0 34px 46px -18px rgba(20,24,30,.38),0 4px 10px rgba(20,24,30,.14),inset 0 0 0 1px rgba(255,255,255,.1)}
.card:hover .face,.card.hl .face{box-shadow:0 50px 70px -20px rgba(20,24,30,.5),0 6px 14px rgba(20,24,30,.18),inset 0 0 0 1px rgba(255,255,255,.16)}
.no{position:absolute;left:5cqw;top:4cqh;z-index:4;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.light .no{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.16)}
/* the glass front panel: body + rounded tab, slides down on hover to open the folder */
.glass{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:2;transition:transform .75s var(--ease)}
.card:hover .glass,.card.hl .glass{transform:translateY(17%)}
.gb,.gt{position:absolute;-webkit-backdrop-filter:blur(24px) saturate(1.8) brightness(1.08);backdrop-filter:blur(24px) saturate(1.8) brightness(1.08);background:linear-gradient(165deg,rgba(255,255,255,.46),color-mix(in srgb,var(--fc) 36%,rgba(255,255,255,.1)));transition:backdrop-filter .7s var(--ease),-webkit-backdrop-filter .7s var(--ease)}
.card:hover .gb,.card:hover .gt,.card.hl .gb,.card.hl .gt{-webkit-backdrop-filter:blur(9px) saturate(1.4);backdrop-filter:blur(9px) saturate(1.4)}
.gb{left:0;right:0;bottom:0;top:15%;border-radius:20px 20px 18px 18px;
 background-image:
  linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.95)),
  linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.95)),
  radial-gradient(120% 90% at var(--gx,20%) 0,rgba(255,255,255,.3),transparent 60%),
  linear-gradient(165deg,rgba(255,255,255,.46),color-mix(in srgb,var(--fc) 36%,rgba(255,255,255,.1)));
 background-position:left 0 top 0,right 0 top 0,0 0,0 0;
 background-size:58% 3px,12% 3px,100% 100%,100% 100%;background-repeat:no-repeat;
 box-shadow:inset 0 -5px 7px -3px rgba(255,255,255,.7),inset 4px 0 6px -3px rgba(255,255,255,.6),inset -4px 0 6px -3px rgba(255,255,255,.4),0 18px 24px -14px rgba(0,0,0,.35)}
.gt{left:59%;width:28%;top:0;height:calc(15% + 1px);border-radius:16px 16px 0 0;border-top:3px solid rgba(255,255,255,.95);box-shadow:inset 3px 0 5px -3px rgba(255,255,255,.6),inset -3px 0 5px -3px rgba(255,255,255,.4)}
/* soft iridescent edge */
.gb:before,.gt:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.7;background:linear-gradient(115deg,#ff9bd6,#ffd86e,#80f3cf,#8aa9ff,#d99cff,#ff9bd6) 0 0/300% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);transition:background-position 1.2s var(--ease)}
.gb:before{padding:0 2px 2px}
.gt:before{padding:2px 2px 0}
.card:hover .gb:before,.card:hover .gt:before,.card.hl .gb:before,.card.hl .gt:before{background-position:100% 0}
.glass .lbl{left:7%;right:30%;bottom:24%}
.glass .lbl em{display:none}
.kind{position:absolute;left:7%;top:calc(15% + 12px);font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:99px;border:1px solid currentColor;opacity:.85}
.go{position:absolute;left:calc(73% - 11px);top:calc(4.6cqh - 11px);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;background:rgba(255,255,255,.95);color:#111;transition:transform .4s var(--ease),background .3s}
.card:hover .go,.card.hl .go{background:var(--accent);transform:rotate(45deg) scale(1.15)}
@media (max-width:900px){.slab{inset:auto;left:16%;top:-14px;width:32%;height:20px;z-index:0}.sheet{top:-18px}}

/* design screen peeking out of the folder */
.shot{left:14cqw;top:12cqw;width:72cqw;height:62cqw;border-radius:2.4cqw;background:#fff;overflow:hidden;box-shadow:0 3.4cqw 6.5cqw rgba(10,14,30,.38),0 0 0 .35cqw rgba(255,255,255,.55);transform:translateZ(46px) rotateY(-12deg) rotateX(4deg) rotate(-2.5deg);animation:shotFloat 6s ease-in-out infinite}
.shot-bar{left:0;top:0;right:0;height:5.2cqw;background:#f2f4f7;border-bottom:1px solid #e1e5ec}
.shot-bar:before{content:"";left:2.2cqw;top:1.8cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#ff6159;box-shadow:2.4cqw 0 #ffbd2e,4.8cqw 0 #28c941}

@keyframes shotFloat{0%,100%{translate:0 0}50%{translate:0 -1.2cqw}}

 about:{tag:"About",title:"About Me",html:`<p>I'm Rajatha Rao V, a Product Designer and UI/UX Designer with a Master's in Human-Computer Interaction from DePaul University.</p><p>My work spans fintech product design, user research, interaction design, wireframing, prototyping and visual design.</p><p>I believe good digital experiences come from understanding people first: investigating the problem, developing solutions and telling the story clearly.</p>`},

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const stage=$("#stage"),rig=$("#rig"),idxEl=$("#idx"),panel=$("#panel"),overlay=$("#overlay");

/* ---- build cards + index ---- */
rig.innerHTML=PROJECTS.map((p,i)=>`<span class="tag" aria-hidden="true" style="--i:${i}">(0${i+1})</span>`).join("")+PROJECTS.map((p,i)=>`<button class="card${p.light?" light":""}" data-i="${i}" style="--i:${i};--fc:${FC[p.name]||'#333'}" aria-label="${p.name}, ${p.cat}"><span class="sheet"></span><span class="slab"></span><span class="face"><span class="scene ${p.bg}" style="inset:0"><span class="fit">${p.scene}</span></span><span class="no">0${i+1}</span><span class="glass"><span class="gb"></span><span class="gt"></span><span class="kind">${p.href?"Case study":"Preview"}</span><span class="lbl"><em>Open ↗</em><b>${p.name}</b><i>${p.cat}</i></span><span class="go" aria-hidden="true">↗</span></span></span></button>`).join("");
idxEl.innerHTML=PROJECTS.map((p,i)=>`<button data-i="${i}"><span>0${i+1}. ${p.name}</span><span aria-hidden="true">↗</span></button>`).join("")+`<button class="res" data-res><span>Research Papers (${PAPERS.length})</span><span aria-hidden="true">↗</span></button>`;
const cards=$$(".card"),idx=$$("#idx button[data-i]");
const mobile=matchMedia("(max-width:900px)"),reduce=matchMedia("(prefers-reduced-motion:reduce)");
let current=-1,lastFocus=null;
addEventListener("pageshow",e=>{if(e.persisted)$$(".wipe").forEach(x=>x.remove())});

/* the colored backdrop sits on .face, scene layers stay transparent */
$$(".scene").forEach(s=>{const f=s.parentElement;f.classList.add(...[...s.classList].filter(c=>c.startsWith("bg-")));s.className="scene"});

let sel=-1;
function part(i){const S=cards[0].offsetWidth*.24;cards.forEach((c,n)=>{const k=i>=0&&n<i&&current<0?1+(i-n-1)*.12:0;c.style.setProperty("--ox",(-k*S)+"px");c.style.setProperty("--oy",(k*S*.5)+"px")})}
function step(d){sel=sel<0?(d>0?0:cards.length-1):(sel+d+cards.length)%cards.length;hl(sel)}
function hl(i){if(i>=0)sel=i;if(!mobile.matches)part(i);cards.forEach((c,n)=>c.classList.toggle("hl",n===i));idx.forEach((b,n)=>b.classList.toggle("hl",n===i));stage.classList.toggle("has-hl",i>=0&&current<0)}
[...cards,...idx].forEach(el=>{const i=+el.dataset.i;
 el.addEventListener("mouseenter",()=>hl(i));el.addEventListener("mouseleave",()=>hl(-1));
 el.addEventListener("focus",()=>hl(i));el.addEventListener("blur",()=>hl(-1));
 el.addEventListener("click",()=>openProject(i,el))});
$("#idx .res").onclick=e=>{lastFocus=e.currentTarget;showPage("research")};

/* page + per-card parallax */
addEventListener("mousemove",e=>{if(reduce.matches||mobile.matches||current>=0)return;
 stage.style.setProperty("--mx",(e.clientX/innerWidth*2-1).toFixed(3));
 stage.style.setProperty("--my",(e.clientY/innerHeight*2-1).toFixed(3))});
stage.addEventListener("mouseleave",()=>{stage.style.setProperty("--mx",0);stage.style.setProperty("--my",0)});
cards.forEach(c=>{const s=c.querySelector(".scene");
 c.addEventListener("mousemove",e=>{if(reduce.matches||mobile.matches)return;const r=c.getBoundingClientRect();c.style.setProperty("--gx",((e.clientX-r.left)/r.width*100).toFixed(0)+"%");c.style.setProperty("--gy",((e.clientY-r.top)/r.height*100).toFixed(0)+"%");
  s.style.setProperty("--px",((e.clientX-r.left)/r.width*2-1).toFixed(2));s.style.setProperty("--py",((e.clientY-r.top)/r.height*2-1).toFixed(2))});
 c.addEventListener("mouseleave",()=>{s.style.setProperty("--px",0);s.style.setProperty("--py",0)})});

function openProject(i,from){
 closeOverlay(true);lastFocus=from||lastFocus;current=i;
 const p=PROJECTS[i];if(p.href){go(p,i);return}
 $("#pCat").textContent=`0${i+1} — ${p.cat}`;$("#pTitle").textContent=p.name;$("#pDesc").textContent=p.desc;
 cards.forEach((c,n)=>{c.classList.toggle("on",n===i);c.classList.remove("hl");c.style.setProperty("--ox","0px");c.style.setProperty("--oy","0px")});
 if(!mobile.matches){const c=cards[i];
  c.style.setProperty("--fx",(stage.clientWidth*.3-rig.offsetLeft-c.offsetLeft-c.offsetWidth*.55)+"px");
  c.style.setProperty("--fy",(stage.clientHeight*.5-c.offsetTop-c.offsetHeight*.55)+"px");
  stage.classList.add("focus")}
 panel.classList.add("open");panel.setAttribute("aria-hidden","false");$("#back").focus({preventScroll:true});
 idx.forEach((b,n)=>b.classList.toggle("hl",n===i));
}
function go(p,i){
 const r=cards[i].querySelector(".face").getBoundingClientRect();
 if(reduce.matches){location.href=p.href;return}
 const W=p.wipe||{title:p.name,cols:["#5FC322","#F57920","#4C6FFF"]},cols=W.cols;
 cols.forEach((c,k)=>{const o=document.createElement("div");o.className="wipe";o.style.background=c;
  if(k===2){o.innerHTML="<span>"+W.title+"<i>.</i></span>"}
  document.body.appendChild(o);
  const an=o.animate([{clipPath:`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 2px)`},{clipPath:"inset(0px 0px 0px 0px round 0px)"}],{duration:750,delay:k*110,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"});
  if(k===2){an.onfinish=()=>{try{sessionStorage.setItem("tr","card")}catch(_){}location.href=p.href};o.firstChild.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:450,delay:500,fill:"forwards"})}
 });
}
function closeProject(){if(current<0)return;current=-1;stage.classList.remove("focus");
 cards.forEach(c=>c.classList.remove("on"));idx.forEach(b=>b.classList.remove("hl"));
 panel.classList.remove("open");panel.setAttribute("aria-hidden","true");lastFocus&&lastFocus.focus({preventScroll:true})}
$("#back").onclick=closeProject;

function setNav(k){$$("nav button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.page===k)))}
function showPage(k){
 closeProject();
 if(k==="projects"){closeOverlay();return}
 const d=k==="cases"?{tag:"Case Studies",title:"Case Studies",html:`<p>Five case studies are planned. Each will cover research, problem framing, design decisions and outcomes.</p><div class="list">${PROJECTS.map((p,i)=>`<button data-open="${i}"><span>0${i+1}. ${p.name}</span><small>${p.cat}</small></button>`).join("")}</div>`}:PAGES[k];
 $("#dTag").textContent=d.tag;$("#dTitle").textContent=d.title;$("#dBody").innerHTML=d.html;
 $$("#dBody [data-open]").forEach(b=>b.onclick=()=>{closeOverlay(true);openProject(+b.dataset.open,b)});
 overlay.classList.add("open");setNav(k);$("#close").focus();
}
function closeOverlay(silent){overlay.classList.remove("open");if(!silent)setNav("projects")}
$$("nav button").forEach(b=>b.onclick=()=>{lastFocus=b;showPage(b.dataset.page)});
$("#close").onclick=()=>closeOverlay();
overlay.addEventListener("click",e=>{if(e.target===overlay)closeOverlay()});
addEventListener("keydown",e=>{if(e.key==="Escape"){overlay.classList.contains("open")?closeOverlay():closeProject()}
 if(e.key==="Tab"&&overlay.classList.contains("open")){const f=$$("#overlay button"),a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
let wt=0;
stage.addEventListener("wheel",e=>{if(mobile.matches||current>=0||reduce.matches&&false)return;e.preventDefault();const t=Date.now();if(t-wt<380)return;wt=t;step(e.deltaY>0?1:-1)},{passive:false});
addEventListener("keydown",e=>{if(mobile.matches||current>=0||overlay.classList.contains("open"))return;
 if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();step(1)}
 else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();step(-1)}
 else if(e.key==="Enter"&&sel>=0&&document.activeElement===document.body){openProject(sel,null)}});
addEventListener("resize",()=>{if(current>=0)closeProject()});
})();
</script>
<script>
(()=>{
const R=".btn,.close,.list button,.cta,.top a,.backtop,[role=tab],.secnav a",M=".btn,.cta,.top a,.backtop,.close,.homeorb";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,hover=matchMedia("(hover:hover)").matches;
if(!reduce){
 document.addEventListener("pointerdown",e=>{const b=e.target.closest(R);if(!b)return;
  if(getComputedStyle(b).position==="static")b.style.position="relative";b.style.overflow="hidden";
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement("span");
  s.className="ripple";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),700)});
}
if(!reduce&&hover){
 document.addEventListener("pointermove",e=>{const b=e.target.closest&&e.target.closest(M);
  document.querySelectorAll(M+".mag-on").forEach(x=>{if(x!==b){x.classList.remove("mag-on");x.style.setProperty("--tx","0px");x.style.setProperty("--ty","0px")}});
  if(!b)return;b.classList.add("mag","mag-on");
  const r=b.getBoundingClientRect();
  b.style.setProperty("--tx",((e.clientX-r.left-r.width/2)*.22).toFixed(1)+"px");
  b.style.setProperty("--ty",((e.clientY-r.top-r.height/2)*.3).toFixed(1)+"px")});
}
})();
</script>
